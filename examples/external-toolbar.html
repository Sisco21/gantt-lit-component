<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barre d’outils externe — Gantt</title>
  <style>
    body { margin: 24px; font: 16px/1.5 system-ui, sans-serif; background: #f4f6f8; color: #172b4d; }
    h1 { font-size: 24px; margin-block-end: 8px; }
    p { max-width: 80ch; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-block: 16px; }
    .zoom-controls { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    button, input { font: inherit; padding: 6px 10px; }
    button:focus-visible, input:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    gantt-chart { display: block; height: 620px; background: white; }
    output { min-inline-size: 6ch; }
  </style>
</head>
<body>
  <h1>Une barre d’outils dans l’application hôte</h1>
  <p>Cette barre est entièrement hors du composant. Les clics droits ouvrent également un menu de l’hôte. Les mêmes méthodes et événements restent disponibles avec ou sans les contrôles intégrés.</p>
  <nav aria-label="Actions du planning">
    <button id="create">Nouvelle tâche</button><button id="edit">Modifier</button><button id="fit">Ajuster</button>
    <button id="expand">Tout déplier</button><button id="collapse">Tout replier</button>
    <span class="zoom-controls"><button id="zoom-out" aria-label="Réduire le zoom">−</button><output id="zoom" aria-label="Niveau de zoom"></output><button id="zoom-in" aria-label="Augmenter le zoom">+</button></span>
    <label>Rechercher <input id="search" type="search"></label>
    <button id="previous" aria-label="Résultat précédent">Précédent</button><output id="matches" aria-live="polite"></output><button id="next" aria-label="Résultat suivant">Suivant</button>
    <button id="undo">Annuler</button><button id="redo">Rétablir</button>
    <button id="resources-window">Détacher les ressources</button>
  </nav>
  <gantt-chart></gantt-chart>
  <p id="result" role="status"></p>
  <script type="module" src="./external-toolbar.ts"></script>
</body>
</html>
