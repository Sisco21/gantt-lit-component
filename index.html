<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gantt Chart - Lit Component</title>
  <link rel="stylesheet" href="/demo/styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Gantt Chart Component</h1>
      <p>Reusable Lit Component with parent tasks, drag & drop, and custom colors</p>
    </header>

    <div class="toolbar">
      <button id="btn-json">📥 Import JSON</button>
      <button id="btn-mpp">📥 Import MS Project</button>
      <button id="btn-sample">📋 Charger Exemple</button>
      <button id="btn-reset">🔄 Réinitialiser</button>
      <label class="calendar-control visual-style-control">Style
        <select id="visual-style" aria-label="Style de démonstration">
          <option value="material">Material</option>
          <option value="fluent">Fluent</option>
          <option value="dark-operations">Opérations sombre</option>
        </select>
      </label>
      <button id="btn-theme" type="button" aria-pressed="false">Passer au thème sombre</button>
      <label class="calendar-control">Début de semaine
        <select id="week-start">
          <option value="1">Lundi</option>
          <option value="0">Dimanche</option>
        </select>
      </label>
      <label class="calendar-control">Numérotation
        <select id="week-numbering">
          <option value="first-full-week">Première semaine complète</option>
          <option value="iso">ISO-8601</option>
        </select>
      </label>
    </div>

    <div id="status" class="status"></div>

    <gantt-chart id="gantt" theme="light"></gantt-chart>

    <input type="file" id="json-input" accept=".json" style="display:none" />
    <input type="file" id="mpp-input" accept=".mpp,.xml" style="display:none" />

    <dialog id="loading-dialog" class="loading-dialog" aria-labelledby="loading-title" aria-live="polite">
      <div class="loading-dialog-content">
        <h2 id="loading-title">Chargement du planning</h2>
        <p>Préparation des données exemple…</p>
        <progress aria-label="Chargement en cours"></progress>
      </div>
    </dialog>
  </div>

  <script type="module" src="/demo/main.ts"></script>
</body>
</html>
